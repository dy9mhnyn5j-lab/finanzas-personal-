<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Finanzas</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: rgba(255,255,255,0.06);
    --text: #f0f0f5;
    --text2: #7a7a9a;
    --green: #00e5a0;
    --green-dim: rgba(0,229,160,0.12);
    --red: #ff4d6d;
    --red-dim: rgba(255,77,109,0.12);
    --blue: #4d9fff;
    --blue-dim: rgba(77,159,255,0.12);
    --gold: #ffd166;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .app { position: relative; z-index: 1; max-width: 430px; margin: 0 auto; padding: 24px 16px 100px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px; }
  .header-left h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .header-left h1 span { color: var(--green); }
  .header-left p { color: var(--text2); font-size: 13px; font-family: 'DM Mono', monospace; margin-top: 2px; }
  .refresh-btn {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text2); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .refresh-btn:hover { color: var(--green); border-color: var(--green); }
  .refresh-btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* KPI Cards */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .kpi-wide { grid-column: 1 / -1; }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s;
  }
  .kpi:active { transform: scale(0.98); }
  .kpi::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .kpi.green::before { background: var(--green); }
  .kpi.red::before { background: var(--red); }
  .kpi.blue::before { background: var(--blue); }
  .kpi-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; }
  .kpi-value { font-family: 'DM Mono', monospace; font-size: 26px; font-weight: 500; letter-spacing: -1px; }
  .kpi-wide .kpi-value { font-size: 36px; }
  .kpi.green .kpi-value { color: var(--green); }
  .kpi.red .kpi-value { color: var(--red); }
  .kpi.blue .kpi-value { color: var(--text); }
  .kpi-sub { font-size: 11px; color: var(--text2); margin-top: 4px; font-family: 'DM Mono', monospace; }
  .kpi-bg-icon { position: absolute; right: 12px; top: 12px; font-size: 28px; opacity: 0.12; }

  /* Section */
  .section { margin-top: 24px; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .section-title { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text2); }

  /* Donut chart */
  .donut-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .donut-container { display: flex; align-items: center; gap: 20px; }
  .donut-svg { flex-shrink: 0; }
  .donut-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .legend-label { font-size: 12px; color: var(--text2); flex: 1; }
  .legend-amount { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text); }
  .donut-center { text-align: center; }
  .donut-total { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; }
  .donut-label { font-size: 10px; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; }

  /* Category bars */
  .cat-list { display: flex; flex-direction: column; gap: 10px; }
  .cat-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .cat-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .cat-item-name { font-size: 14px; font-weight: 600; }
  .cat-item-amount { font-family: 'DM Mono', monospace; font-size: 14px; }
  .cat-bar-bg { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: 2px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
  .cat-item-sub { font-size: 11px; color: var(--text2); margin-top: 6px; font-family: 'DM Mono', monospace; }

  /* Monthly bars */
  .monthly-chart {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .month-bars { display: flex; align-items: flex-end; gap: 6px; height: 100px; margin-bottom: 8px; }
  .month-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .month-bar-wrap { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
  .month-bar {
    width: 100%; border-radius: 4px 4px 0 0;
    transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 2px;
  }
  .month-bar.income { background: var(--green); opacity: 0.7; }
  .month-bar.expense { background: var(--red); opacity: 0.8; }
  .month-label { font-size: 9px; color: var(--text2); font-family: 'DM Mono', monospace; text-align: center; }
  .month-legend { display: flex; gap: 16px; }
  .month-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); }
  .month-legend-dot { width: 8px; height: 8px; border-radius: 2px; }

  /* Transactions */
  .tx-list { display: flex; flex-direction: column; gap: 8px; }
  .tx-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tx-icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .tx-icon.expense { background: var(--red-dim); }
  .tx-icon.income { background: var(--green-dim); }
  .tx-info { flex: 1; }
  .tx-cat { font-size: 14px; font-weight: 600; }
  .tx-desc { font-size: 11px; color: var(--text2); margin-top: 1px; font-family: 'DM Mono', monospace; }
  .tx-right { text-align: right; }
  .tx-amount { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; }
  .tx-amount.expense { color: var(--red); }
  .tx-amount.income { color: var(--green); }
  .tx-date { font-size: 10px; color: var(--text2); margin-top: 2px; font-family: 'DM Mono', monospace; }

  /* Loading */
  .loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; gap: 16px;
  }
  .loading-spinner {
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--green);
    animation: spin 0.8s linear infinite;
  }
  .loading p { color: var(--text2); font-size: 13px; font-family: 'DM Mono', monospace; }

  /* Error */
  .error-card {
    background: var(--red-dim); border: 1px solid var(--red);
    border-radius: var(--radius); padding: 20px; text-align: center;
  }
  .error-card p { color: var(--red); font-size: 13px; margin-top: 8px; }

  /* Empty */
  .empty { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 14px; }

  /* Tab bar */
  .tab-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: rgba(13,13,20,0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; cursor: pointer; padding: 6px;
    color: var(--text2); font-family: 'Syne', sans-serif; font-size: 10px; font-weight: 600;
    letter-spacing: 0.5px; text-transform: uppercase; transition: color 0.2s;
  }
  .tab-btn.active { color: var(--green); }
  .tab-icon { font-size: 20px; }

  /* Tabs content */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Savings rate pill */
  .rate-pill {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--green-dim); border: 1px solid rgba(0,229,160,0.2);
    border-radius: 100px; padding: 4px 10px;
    font-size: 12px; color: var(--green); font-family: 'DM Mono', monospace;
  }
  .rate-pill.negative { background: var(--red-dim); border-color: rgba(255,77,109,0.2); color: var(--red); }

  .fade-in { animation: fadeIn 0.4s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <h1>Finance<span>.</span></h1>
      <p id="last-updated">Loading...</p>
    </div>
    <button class="refresh-btn" id="refresh-btn" onclick="loadData()">↻</button>
  </div>

  <div id="loading" class="loading">
    <div class="loading-spinner"></div>
    <p>Loading your finances...</p>
  </div>

  <div id="main" style="display:none">
    <!-- Tab contents -->
    <div class="tab-content active" id="tab-overview">
      <!-- KPI Cards -->
      <div class="kpi-grid">
        <div class="kpi blue kpi-wide">
          <div class="kpi-label">Balance total</div>
          <div class="kpi-value" id="kpi-balance">$0.00</div>
          <div class="kpi-sub" id="kpi-savings-rate"></div>
          <div class="kpi-bg-icon">⚖️</div>
        </div>
        <div class="kpi green">
          <div class="kpi-label">Ingresos</div>
          <div class="kpi-value" id="kpi-income">$0.00</div>
          <div class="kpi-bg-icon">💵</div>
        </div>
        <div class="kpi red">
          <div class="kpi-label">Gastos</div>
          <div class="kpi-value" id="kpi-expense">$0.00</div>
          <div class="kpi-bg-icon">💸</div>
        </div>
      </div>

      <!-- Donut chart -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Por categoría</span>
        </div>
        <div class="donut-wrap">
          <div class="donut-container">
            <div style="position:relative">
              <svg class="donut-svg" width="120" height="120" id="donut-svg"></svg>
              <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center">
                <div class="donut-total" id="donut-total">$0</div>
                <div class="donut-label">gastos</div>
              </div>
            </div>
            <div class="donut-legend" id="donut-legend"></div>
          </div>
        </div>
      </div>

      <!-- Monthly chart -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Por mes</span>
          <div class="month-legend">
            <div class="month-legend-item"><div class="month-legend-dot" style="background:var(--green)"></div>Ingresos</div>
            <div class="month-legend-item"><div class="month-legend-dot" style="background:var(--red)"></div>Gastos</div>
          </div>
        </div>
        <div class="monthly-chart">
          <div class="month-bars" id="month-bars"></div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-categories">
      <div class="cat-list" id="cat-list"></div>
    </div>

    <div class="tab-content" id="tab-transactions">
      <div class="tx-list" id="tx-list"></div>
    </div>
  </div>
</div>

<!-- Tab bar -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('overview', this)">
    <span class="tab-icon">◎</span>Overview
  </button>
  <button class="tab-btn" onclick="switchTab('categories', this)">
    <span class="tab-icon">▦</span>Categorías
  </button>
  <button class="tab-btn" onclick="switchTab('transactions', this)">
    <span class="tab-icon">≡</span>Movimientos
  </button>
</div>

<script>
const SHEET_ID = '1p4-KcqYBAMWqYXgUcqJQTUZOhO4vDPbFAiT4g3LqolI';
const API_KEY = 'AIzaSyCY4Io5FzzI3OIcAHqjn721TQlxR7dt1uA';
const RANGE = 'Movimientos!A2:F500';

const CAT_COLORS = {
  'Bencina': '#4d9fff', 'Seguro': '#7b9fff', 'Service': '#9db8ff', 'Rego': '#bdd0ff',
  'Super': '#00e5a0', 'Salir a comer': '#00c98a', 'Weas': '#00ad74', 'Delivery': '#009160',
  'Plan Celular': '#ffd166', 'Netflix': '#ffbc45', 'Amazon': '#ffa724',
  'Alcohol': '#ff4d6d', 'Ticket fiesta': '#ff6b85',
  'Ropa': '#c77dff', 'Accesorio': '#d49fff', 'Peluqueria': '#e2c2ff',
  'Salud': '#e76f51', 'Farmacia': '#f4845f', 'Gym': '#f9a27d', 'Suplementos': '#fdc09a',
  'Pasaje': '#48cae4', 'Hotel': '#00b4d8', 'Transporte': '#0096c7', 'Tours': '#0077b6',
  'Otros': '#555577',
  'Mina': '#00e5a0', 'Transferencia': '#00c98a', 'Otros ingresos': '#009160',
};

const PARENT_EMOJIS = {
  'Bencina':'🚗','Seguro':'🚗','Service':'🚗','Rego':'🚗',
  'Super':'🛒','Salir a comer':'🛒','Weas':'🛒','Delivery':'🛒',
  'Plan Celular':'📱','Netflix':'📱','Amazon':'📱',
  'Alcohol':'🎉','Ticket fiesta':'🎉',
  'Ropa':'👕','Accesorio':'👕','Peluqueria':'👕','Salud':'👕','Farmacia':'👕','Gym':'👕','Suplementos':'👕',
  'Pasaje':'✈️','Hotel':'✈️','Transporte':'✈️','Tours':'✈️',
  'Otros':'📦',
  'Mina':'💰','Transferencia':'💰',
};

let allData = [];

function fmt(n) {
  return '$' + Math.abs(n).toLocaleString('en-AU', {minimumFractionDigits: 0, maximumFractionDigits: 0});
}
function fmtFull(n) {
  return '$' + Math.abs(n).toLocaleString('en-AU', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function parseDate(str) {
  if (!str) return null;
  // Handle "25/5/2026, 8:52 am" or "25/5/2026"
  const clean = str.split(',')[0].trim();
  const parts = clean.split('/');
  if (parts.length === 3) {
    return new Date(parts[2], parts[1]-1, parts[0]);
  }
  return new Date(str);
}

async function loadData() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  
  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    
    if (data.error) throw new Error(data.error.message);
    
    allData = (data.values || []).filter(r => r[0] && r[2] && r[3]).map(r => ({
      date: r[0] || '',
      desc: r[1] || '',
      type: r[2] || '',
      amount: parseFloat(r[3]) || 0,
      cat: (r[4] || '').trim(),
      parsedDate: parseDate(r[0])
    }));

    renderAll();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-AU', {hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div class="error-card"><div style="font-size:32px">⚠️</div><p>${e.message}</p></div>`;
  }
  
  btn.classList.remove('spinning');
}

function renderAll() {
  const expenses = allData.filter(r => r.type === 'Expense');
  const incomes = allData.filter(r => r.type === 'Income');
  const totalExp = expenses.reduce((s,r) => s+r.amount, 0);
  const totalInc = incomes.reduce((s,r) => s+r.amount, 0);
  const balance = totalInc - totalExp;
  const savRate = totalInc > 0 ? ((balance/totalInc)*100).toFixed(0) : 0;

  // KPIs
  document.getElementById('kpi-balance').textContent = (balance >= 0 ? '+' : '-') + fmtFull(balance);
  document.getElementById('kpi-income').textContent = fmtFull(totalInc);
  document.getElementById('kpi-expense').textContent = fmtFull(totalExp);
  document.getElementById('kpi-savings-rate').textContent = `Savings rate: ${savRate}%`;

  // Donut
  renderDonut(expenses, totalExp);
  
  // Monthly
  renderMonthly();
  
  // Categories
  renderCategories(expenses, totalExp);
  
  // Transactions
  renderTransactions();
}

function renderDonut(expenses, totalExp) {
  const bycat = {};
  expenses.forEach(r => { bycat[r.cat] = (bycat[r.cat]||0) + r.amount; });
  const sorted = Object.entries(bycat).sort((a,b) => b[1]-a[1]).slice(0,6);
  
  const svg = document.getElementById('donut-svg');
  const cx = 60, cy = 60, r = 48, inner = 32;
  let html = '';
  let start = -Math.PI/2;
  
  sorted.forEach(([cat, amt]) => {
    const frac = amt / totalExp;
    const angle = frac * 2 * Math.PI;
    const end = start + angle;
    const x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
    const x2 = cx + r * Math.cos(end), y2 = cy + r * Math.sin(end);
    const ix1 = cx + inner * Math.cos(start), iy1 = cy + inner * Math.sin(start);
    const ix2 = cx + inner * Math.cos(end), iy2 = cy + inner * Math.sin(end);
    const large = angle > Math.PI ? 1 : 0;
    const color = CAT_COLORS[cat] || '#555577';
    html += `<path d="M${ix1},${iy1} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} L${ix2},${iy2} A${inner},${inner} 0 ${large},0 ${ix1},${iy1}" fill="${color}"/>`;
    start = end;
  });
  
  svg.innerHTML = html;
  document.getElementById('donut-total').textContent = fmt(totalExp);
  
  const legend = document.getElementById('donut-legend');
  legend.innerHTML = sorted.slice(0,5).map(([cat, amt]) => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${CAT_COLORS[cat]||'#555577'}"></div>
      <span class="legend-label">${cat}</span>
      <span class="legend-amount">${fmt(amt)}</span>
    </div>
  `).join('');
}

function renderMonthly() {
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const now = new Date();
  const year = now.getFullYear();
  
  const byMonth = {};
  allData.forEach(r => {
    const d = r.parsedDate;
    if (!d || d.getFullYear() !== year) return;
    const m = d.getMonth();
    if (!byMonth[m]) byMonth[m] = {inc:0, exp:0};
    if (r.type === 'Income') byMonth[m].inc += r.amount;
    else byMonth[m].exp += r.amount;
  });
  
  const maxVal = Math.max(...Object.values(byMonth).flatMap(v => [v.inc, v.exp]), 1);
  const currentMonth = now.getMonth();
  
  const bars = document.getElementById('month-bars');
  bars.innerHTML = months.map((m, i) => {
    const data = byMonth[i] || {inc:0, exp:0};
    const incH = Math.max((data.inc / maxVal) * 80, data.inc > 0 ? 4 : 0);
    const expH = Math.max((data.exp / maxVal) * 80, data.exp > 0 ? 4 : 0);
    const active = i === currentMonth ? 'opacity:1' : 'opacity:0.5';
    return `
      <div class="month-col" style="${active}">
        <div class="month-bar-wrap">
          <div class="month-bar income" style="height:${incH}px"></div>
          <div class="month-bar expense" style="height:${expH}px"></div>
        </div>
        <div class="month-label">${m}</div>
      </div>
    `;
  }).join('');
}

function renderCategories(expenses, totalExp) {
  const bycat = {};
  expenses.forEach(r => { bycat[r.cat] = (bycat[r.cat]||0) + r.amount; });
  const sorted = Object.entries(bycat).sort((a,b) => b[1]-a[1]);
  
  const list = document.getElementById('cat-list');
  list.innerHTML = sorted.length ? sorted.map(([cat, amt]) => {
    const pct = totalExp > 0 ? (amt/totalExp*100).toFixed(0) : 0;
    const color = CAT_COLORS[cat] || '#555577';
    const emoji = PARENT_EMOJIS[cat] || '📦';
    return `
      <div class="cat-item">
        <div class="cat-item-header">
          <div class="cat-item-name">${emoji} ${cat}</div>
          <div class="cat-item-amount" style="color:${color}">${fmtFull(amt)}</div>
        </div>
        <div class="cat-bar-bg">
          <div class="cat-bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
        <div class="cat-item-sub">${pct}% del total</div>
      </div>
    `;
  }).join('') : '<div class="empty">No hay gastos aún</div>';
}

function renderTransactions() {
  const sorted = [...allData].sort((a,b) => (b.parsedDate||0) - (a.parsedDate||0)).slice(0,30);
  const list = document.getElementById('tx-list');
  list.innerHTML = sorted.length ? sorted.map(r => {
    const isExp = r.type === 'Expense';
    const color = CAT_COLORS[r.cat] || '#555577';
    const emoji = PARENT_EMOJIS[r.cat] || (isExp ? '💸' : '💵');
    const dateStr = r.parsedDate ? r.parsedDate.toLocaleDateString('es', {day:'numeric', month:'short'}) : r.date.split(',')[0];
    return `
      <div class="tx-item">
        <div class="tx-icon ${isExp?'expense':'income'}">${emoji}</div>
        <div class="tx-info">
          <div class="tx-cat">${r.cat || (isExp ? 'Gasto' : 'Ingreso')}</div>
          <div class="tx-desc">${r.desc || '—'}</div>
        </div>
        <div class="tx-right">
          <div class="tx-amount ${isExp?'expense':'income'}">${isExp?'-':'+'}${fmtFull(r.amount)}</div>
          <div class="tx-date">${dateStr}</div>
        </div>
      </div>
    `;
  }).join('') : '<div class="empty">No hay movimientos aún</div>';
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  btn.classList.add('active');
}

loadData();
</script>
</body>
</html>
