<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Finanzas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050508;
    --surface: #0f0f14;
    --surface2: #16161e;
    --surface3: #1e1e28;
    --border: rgba(255,255,255,0.05);
    --border2: rgba(255,255,255,0.08);
    --text: #f4f4f8;
    --text2: #6e6e8a;
    --text3: #44445a;
    --green: #34d399;
    --green-dim: rgba(52,211,153,0.1);
    --green-mid: rgba(52,211,153,0.25);
    --red: #f43f5e;
    --red-dim: rgba(244,63,94,0.1);
    --red-mid: rgba(244,63,94,0.25);
    --blue: #60a5fa;
    --blue-dim: rgba(96,165,250,0.1);
    --purple: #a78bfa;
    --purple-dim: rgba(167,139,250,0.1);
    --gold: #fbbf24;
    --gold-dim: rgba(251,191,36,0.1);
    --radius: 20px;
    --radius-sm: 14px;
    --radius-xs: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app { position: relative; z-index: 1; max-width: 430px; margin: 0 auto; padding: 20px 16px 100px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  .header h1 span { 
    background: linear-gradient(135deg, var(--green), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .refresh-btn {
    width: 38px; height: 38px; border-radius: var(--radius-xs);
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text2); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .refresh-btn:active { transform: scale(0.9); }
  .refresh-btn.spinning { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Month Filter */
  .month-filter {
    display: flex; gap: 6px; overflow-x: auto; margin-bottom: 20px;
    padding: 4px 0; scrollbar-width: none; -ms-overflow-style: none;
  }
  .month-filter::-webkit-scrollbar { display: none; }
  .month-pill {
    flex-shrink: 0; padding: 8px 14px; border-radius: 100px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text2); font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .month-pill.active {
    background: var(--green-dim); border-color: var(--green-mid);
    color: var(--green);
  }
  .month-pill:active { transform: scale(0.95); }

  /* KPI Cards */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .kpi-wide { grid-column: 1 / -1; }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .kpi:active { transform: scale(0.98); transition: transform 0.1s; }
  .kpi-label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text2); margin-bottom: 10px; }
  .kpi-value { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 600; letter-spacing: -1px; }
  .kpi-wide .kpi-value { font-size: 38px; }
  .kpi.green .kpi-value { color: var(--green); }
  .kpi.red .kpi-value { color: var(--red); }
  .kpi.blue .kpi-value { color: var(--text); }
  .kpi-sub { font-size: 11px; color: var(--text2); margin-top: 6px; font-family: 'JetBrains Mono', monospace; }
  .kpi-glow {
    position: absolute; width: 120px; height: 120px; border-radius: 50%;
    filter: blur(40px); opacity: 0.15; top: -30px; right: -30px;
  }
  .kpi.green .kpi-glow { background: var(--green); }
  .kpi.red .kpi-glow { background: var(--red); }
  .kpi.blue .kpi-glow { background: var(--blue); }

  /* Section */
  .section { margin-top: 28px; }
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .section-title { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text2); }

  /* Top expense card */
  .top-expense {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 10px;
  }
  .top-expense-icon { font-size: 28px; }
  .top-expense-info { flex: 1; }
  .top-expense-label { font-size: 11px; color: var(--text2); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .top-expense-cat { font-size: 16px; font-weight: 700; margin-top: 2px; }
  .top-expense-amount { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; color: var(--red); }

  /* Donut chart */
  .donut-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .donut-container { display: flex; align-items: center; gap: 24px; }
  .donut-svg { flex-shrink: 0; }
  .donut-legend { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .legend-item { display: flex; align-items: center; gap: 10px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-label { font-size: 12px; color: var(--text2); flex: 1; font-weight: 500; }
  .legend-amount { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); font-weight: 500; }
  .donut-center { text-align: center; }
  .donut-total { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; }
  .donut-label { font-size: 10px; color: var(--text2); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

  /* Category groups */
  .cat-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .cat-group-header {
    padding: 16px 18px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
  }
  .cat-group-left { display: flex; align-items: center; gap: 10px; }
  .cat-group-emoji { font-size: 20px; }
  .cat-group-name { font-size: 15px; font-weight: 700; }
  .cat-group-amount { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; }
  .cat-group-bar { height: 3px; background: var(--border); margin: 0 18px; }
  .cat-group-bar-fill { height: 100%; border-radius: 2px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
  .cat-group-items { padding: 0 18px 14px; display: flex; flex-direction: column; gap: 8px; }
  .cat-sub-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: var(--radius-xs);
  }
  .cat-sub-name { font-size: 13px; color: var(--text2); font-weight: 500; }
  .cat-sub-amount { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); }
  .cat-sub-pct { font-size: 11px; color: var(--text3); margin-left: 8px; }

  /* Monthly bars */
  .monthly-chart {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 16px 16px;
  }
  .month-bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; margin-bottom: 8px; }
  .month-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; }
  .month-bar-wrap { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; align-items: center; }
  .month-bar {
    width: 70%; border-radius: 4px;
    transition: height 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 0;
  }
  .month-bar.income { background: var(--green); opacity: 0.8; }
  .month-bar.expense { background: var(--red); opacity: 0.8; }
  .month-label { font-size: 9px; color: var(--text3); font-family: 'JetBrains Mono', monospace; text-align: center; font-weight: 500; }
  .month-label.active { color: var(--text); font-weight: 700; }
  .month-amount { font-size: 8px; color: var(--text2); font-family: 'JetBrains Mono', monospace; writing-mode: horizontal-tb; margin-top: 2px; }
  .month-legend { display: flex; gap: 16px; }
  .month-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); font-weight: 500; }
  .month-legend-dot { width: 8px; height: 8px; border-radius: 3px; }

  /* Transactions */
  .tx-list { display: flex; flex-direction: column; gap: 6px; }
  .tx-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tx-icon {
    width: 42px; height: 42px; border-radius: var(--radius-xs);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .tx-icon.expense { background: var(--red-dim); }
  .tx-icon.income { background: var(--green-dim); }
  .tx-info { flex: 1; min-width: 0; }
  .tx-cat { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-desc { font-size: 11px; color: var(--text2); margin-top: 2px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-right { text-align: right; flex-shrink: 0; }
  .tx-amount { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; }
  .tx-amount.expense { color: var(--red); }
  .tx-amount.income { color: var(--green); }
  .tx-date { font-size: 10px; color: var(--text3); margin-top: 3px; font-family: 'JetBrains Mono', monospace; }

  /* Loading */
  .loading {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; gap: 16px;
  }
  .loading-spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2.5px solid var(--surface2);
    border-top-color: var(--green);
    animation: spin 0.7s linear infinite;
  }
  .loading p { color: var(--text2); font-size: 13px; font-weight: 500; }

  /* Error */
  .error-card {
    background: var(--red-dim); border: 1px solid rgba(244,63,94,0.3);
    border-radius: var(--radius); padding: 24px; text-align: center;
  }
  .error-card p { color: var(--red); font-size: 13px; margin-top: 8px; }

  .empty { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 14px; font-weight: 500; }

  /* Tab bar */
  .tab-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: rgba(5,5,8,0.92);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; cursor: pointer; padding: 8px 4px;
    color: var(--text3); font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600;
    letter-spacing: 0.3px; transition: color 0.2s;
  }
  .tab-btn.active { color: var(--green); }
  .tab-icon { font-size: 20px; }

  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .no-data-month { 
    text-align: center; padding: 48px 20px; color: var(--text2); 
    font-size: 14px; font-weight: 500;
  }
  .no-data-month span { font-size: 32px; display: block; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Finance<span>.</span></h1>
    <button class="refresh-btn" id="refresh-btn" onclick="loadData()">↻</button>
  </div>

  <!-- Month filter -->
  <div class="month-filter" id="month-filter"></div>

  <div id="loading" class="loading">
    <div class="loading-spinner"></div>
    <p>Cargando datos...</p>
  </div>

  <div id="main" style="display:none">
    <div class="tab-content active" id="tab-overview">
      <div class="kpi-grid">
        <div class="kpi blue kpi-wide">
          <div class="kpi-glow"></div>
          <div class="kpi-label">Balance</div>
          <div class="kpi-value" id="kpi-balance">$0</div>
          <div class="kpi-sub" id="kpi-savings-rate"></div>
        </div>
        <div class="kpi green">
          <div class="kpi-glow"></div>
          <div class="kpi-label">Ingresos</div>
          <div class="kpi-value" id="kpi-income">$0</div>
        </div>
        <div class="kpi red">
          <div class="kpi-glow"></div>
          <div class="kpi-label">Gastos</div>
          <div class="kpi-value" id="kpi-expense">$0</div>
        </div>
      </div>

      <!-- Top expense -->
      <div class="top-expense" id="top-expense" style="display:none">
        <div class="top-expense-icon" id="top-expense-icon">🔥</div>
        <div class="top-expense-info">
          <div class="top-expense-label">Mayor gasto</div>
          <div class="top-expense-cat" id="top-expense-cat">—</div>
        </div>
        <div class="top-expense-amount" id="top-expense-amount">$0</div>
      </div>

      <!-- Donut chart -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Por categoría</span>
        </div>
        <div class="donut-wrap">
          <div class="donut-container">
            <div style="position:relative">
              <svg class="donut-svg" width="130" height="130" id="donut-svg"></svg>
              <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center">
                <div class="donut-total" id="donut-total">$0</div>
                <div class="donut-label">total</div>
              </div>
            </div>
            <div class="donut-legend" id="donut-legend"></div>
          </div>
        </div>
      </div>

      <!-- Monthly chart -->
      <div class="section">
        <div class="section-header">
          <span class="section-title">Evolución mensual</span>
          <div class="month-legend">
            <div class="month-legend-item"><div class="month-legend-dot" style="background:var(--green)"></div>In</div>
            <div class="month-legend-item"><div class="month-legend-dot" style="background:var(--red)"></div>Out</div>
          </div>
        </div>
        <div class="monthly-chart">
          <div class="month-bars" id="month-bars"></div>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-categories">
      <div id="cat-groups"></div>
    </div>

    <div class="tab-content" id="tab-transactions">
      <div class="tx-list" id="tx-list"></div>
    </div>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('overview', this)">
    <span class="tab-icon">◉</span>Overview
  </button>
  <button class="tab-btn" onclick="switchTab('categories', this)">
    <span class="tab-icon">◫</span>Categorías
  </button>
  <button class="tab-btn" onclick="switchTab('transactions', this)">
    <span class="tab-icon">☰</span>Movimientos
  </button>
</div>

<script>
const SHEET_ID = '1p4-KcqYBAMWqYXgUcqJQTUZOhO4vDPbFAiT4g3LqolI';
const API_KEY = 'AIzaSyCY4Io5FzzI3OIcAHqjn721TQlxR7dt1uA';
const RANGE = 'Movimientos!A2:F500';

const PARENT_MAP = {
  'Bencina':'🚗 Auto','Seguro':'🚗 Auto','Service':'🚗 Auto','Rego':'🚗 Auto',
  'Super':'🛒 Comida','Salir a comer':'🛒 Comida','Weas':'🛒 Comida','Delivery':'🛒 Comida',
  'Plan Celular':'📱 Servicios','Netflix':'📱 Servicios','Amazon':'📱 Servicios',
  'Alcohol':'🎉 Ocio','Ticket fiesta':'🎉 Ocio','D':'🎉 Ocio',
  'Ropa':'👕 Personal','Accesorio':'👕 Personal','Peluqueria':'👕 Personal',
  'Salud':'👕 Personal','Farmacia':'👕 Personal','Gym':'👕 Personal','Suplementos':'👕 Personal',
  'Pasaje':'✈️ Viaje','Hotel':'✈️ Viaje','Comida':'✈️ Viaje','Transporte':'✈️ Viaje','Tours':'✈️ Viaje','Otros viaje':'✈️ Viaje',
  'Mina':'💰 Ingresos','Transferencia':'💰 Ingresos','Otros ingresos':'💰 Ingresos',
  'Otros':'📦 Otros',
};

const CAT_COLORS = {
  '🚗 Auto': '#60a5fa',
  '🛒 Comida': '#34d399',
  '📱 Servicios': '#fbbf24',
  '🎉 Ocio': '#f43f5e',
  '👕 Personal': '#a78bfa',
  '✈️ Viaje': '#22d3ee',
  '💰 Ingresos': '#34d399',
  '📦 Otros': '#6b7280',
};

const SUB_COLORS = {
  'Bencina':'#60a5fa','Seguro':'#93c5fd','Service':'#bfdbfe','Rego':'#3b82f6',
  'Super':'#34d399','Salir a comer':'#6ee7b7','Weas':'#a7f3d0','Delivery':'#10b981',
  'Plan Celular':'#fbbf24','Netflix':'#fcd34d','Amazon':'#f59e0b',
  'Alcohol':'#f43f5e','Ticket fiesta':'#fb7185','D':'#e11d48',
  'Ropa':'#a78bfa','Accesorio':'#c4b5fd','Peluqueria':'#ddd6fe',
  'Salud':'#f97316','Farmacia':'#fb923c','Gym':'#8b5cf6','Suplementos':'#7c3aed',
  'Pasaje':'#22d3ee','Hotel':'#67e8f9','Transporte':'#06b6d4','Tours':'#0891b2','Comida':'#155e75',
  'Mina':'#34d399','Transferencia':'#6ee7b7','Otros ingresos':'#a7f3d0',
  'Otros':'#6b7280',
};

let allData = [];
let filteredData = [];
let selectedMonth = 'all';

function fmt(n) {
  return '$' + Math.abs(n).toLocaleString('en-AU', {minimumFractionDigits: 0, maximumFractionDigits: 0});
}
function fmtFull(n) {
  return '$' + Math.abs(n).toLocaleString('en-AU', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function parseDate(str) {
  if (!str) return null;
  const clean = str.split(',')[0].trim();
  const parts = clean.split('/');
  if (parts.length === 3) {
    return new Date(parseInt(parts[2]), parseInt(parts[1])-1, parseInt(parts[0]));
  }
  return new Date(str);
}

function getMonthKey(d) {
  if (!d) return null;
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function buildMonthFilter() {
  const months = new Set();
  allData.forEach(r => {
    const k = getMonthKey(r.parsedDate);
    if (k) months.add(k);
  });
  const sorted = [...months].sort().reverse();
  const names = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  
  const container = document.getElementById('month-filter');
  let html = `<div class="month-pill ${selectedMonth==='all'?'active':''}" onclick="filterMonth('all')">Todo</div>`;
  sorted.forEach(k => {
    const [y, m] = k.split('-');
    const label = names[parseInt(m)-1] + ' ' + y.slice(2);
    html += `<div class="month-pill ${selectedMonth===k?'active':''}" onclick="filterMonth('${k}')">${label}</div>`;
  });
  container.innerHTML = html;
}

function filterMonth(month) {
  selectedMonth = month;
  if (month === 'all') {
    filteredData = [...allData];
  } else {
    filteredData = allData.filter(r => getMonthKey(r.parsedDate) === month);
  }
  buildMonthFilter();
  renderAll();
}

async function loadData() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  
  try {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    
    if (data.error) throw new Error(data.error.message);
    
    allData = (data.values || []).filter(r => r[0] && r[2] && r[3]).map(r => ({
      date: r[0] || '',
      desc: r[1] || '',
      type: (r[2] || '').trim(),
      amount: parseFloat(r[3]) || 0,
      cat: (r[4] || '').trim(),
      parsedDate: parseDate(r[0])
    }));

    filteredData = [...allData];
    buildMonthFilter();
    renderAll();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('main').style.display = 'block';
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div class="error-card"><div style="font-size:32px">⚠️</div><p>${e.message}</p></div>`;
  }
  
  btn.classList.remove('spinning');
}

function renderAll() {
  const expenses = filteredData.filter(r => r.type === 'Expense');
  const incomes = filteredData.filter(r => r.type === 'Income');
  const totalExp = expenses.reduce((s,r) => s+r.amount, 0);
  const totalInc = incomes.reduce((s,r) => s+r.amount, 0);
  const balance = totalInc - totalExp;
  const savRate = totalInc > 0 ? ((balance/totalInc)*100).toFixed(0) : 0;

  document.getElementById('kpi-balance').textContent = (balance >= 0 ? '+' : '-') + fmtFull(balance);
  document.getElementById('kpi-income').textContent = fmtFull(totalInc);
  document.getElementById('kpi-expense').textContent = fmtFull(totalExp);
  
  const rateEl = document.getElementById('kpi-savings-rate');
  if (totalInc > 0) {
    rateEl.textContent = `Ahorro: ${savRate}%`;
  } else {
    rateEl.textContent = `${expenses.length} gastos registrados`;
  }

  renderTopExpense(expenses);
  renderDonut(expenses, totalExp);
  renderMonthly();
  renderCategories(expenses, totalExp);
  renderTransactions();
}

function renderTopExpense(expenses) {
  const el = document.getElementById('top-expense');
  if (expenses.length === 0) { el.style.display = 'none'; return; }
  
  const top = expenses.reduce((max, r) => r.amount > max.amount ? r : max, expenses[0]);
  const parent = PARENT_MAP[top.cat] || '📦 Otros';
  const emoji = parent.split(' ')[0];
  
  el.style.display = 'flex';
  document.getElementById('top-expense-icon').textContent = emoji;
  document.getElementById('top-expense-cat').textContent = top.cat;
  document.getElementById('top-expense-amount').textContent = fmtFull(top.amount);
}

function renderDonut(expenses, totalExp) {
  const byParent = {};
  expenses.forEach(r => {
    const p = PARENT_MAP[r.cat] || '📦 Otros';
    byParent[p] = (byParent[p]||0) + r.amount;
  });
  const sorted = Object.entries(byParent).sort((a,b) => b[1]-a[1]);
  
  const svg = document.getElementById('donut-svg');
  const cx = 65, cy = 65, r = 55, inner = 38;
  let html = '';
  let start = -Math.PI/2;
  
  if (sorted.length === 0) {
    svg.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${(r+inner)/2}" fill="none" stroke="var(--surface2)" stroke-width="${r-inner}"/>`;
    document.getElementById('donut-total').textContent = '$0';
    document.getElementById('donut-legend').innerHTML = '';
    return;
  }
  
  sorted.forEach(([cat, amt]) => {
    const frac = amt / totalExp;
    const angle = frac * 2 * Math.PI - 0.02;
    const end = start + angle;
    const x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
    const x2 = cx + r * Math.cos(end), y2 = cy + r * Math.sin(end);
    const ix1 = cx + inner * Math.cos(start), iy1 = cy + inner * Math.sin(start);
    const ix2 = cx + inner * Math.cos(end), iy2 = cy + inner * Math.sin(end);
    const large = angle > Math.PI ? 1 : 0;
    const color = CAT_COLORS[cat] || '#6b7280';
    html += `<path d="M${ix1},${iy1} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} L${ix2},${iy2} A${inner},${inner} 0 ${large},0 ${ix1},${iy1}" fill="${color}" opacity="0.85"/>`;
    start = end + 0.02;
  });
  
  svg.innerHTML = html;
  document.getElementById('donut-total').textContent = fmt(totalExp);
  
  const legend = document.getElementById('donut-legend');
  legend.innerHTML = sorted.map(([cat, amt]) => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${CAT_COLORS[cat]||'#6b7280'}"></div>
      <span class="legend-label">${cat}</span>
      <span class="legend-amount">${fmt(amt)}</span>
    </div>
  `).join('');
}

function renderMonthly() {
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const now = new Date();
  const year = now.getFullYear();
  
  const byMonth = {};
  allData.forEach(r => {
    const d = r.parsedDate;
    if (!d || d.getFullYear() !== year) return;
    const m = d.getMonth();
    if (!byMonth[m]) byMonth[m] = {inc:0, exp:0};
    if (r.type === 'Income') byMonth[m].inc += r.amount;
    else byMonth[m].exp += r.amount;
  });
  
  const maxVal = Math.max(...Object.values(byMonth).flatMap(v => [v.inc, v.exp]), 1);
  const currentMonth = now.getMonth();
  
  const bars = document.getElementById('month-bars');
  bars.innerHTML = months.map((m, i) => {
    const data = byMonth[i] || {inc:0, exp:0};
    const incH = Math.max((data.inc / maxVal) * 90, data.inc > 0 ? 4 : 0);
    const expH = Math.max((data.exp / maxVal) * 90, data.exp > 0 ? 4 : 0);
    const isActive = i === currentMonth;
    const opacity = i <= currentMonth ? '1' : '0.3';
    return `
      <div class="month-col" style="opacity:${opacity}">
        <div class="month-bar-wrap">
          <div class="month-bar income" style="height:${incH}px"></div>
          <div class="month-bar expense" style="height:${expH}px"></div>
        </div>
        <div class="month-label ${isActive?'active':''}">${m}</div>
      </div>
    `;
  }).join('');
}

function renderCategories(expenses, totalExp) {
  const byParent = {};
  expenses.forEach(r => {
    const p = PARENT_MAP[r.cat] || '📦 Otros';
    if (!byParent[p]) byParent[p] = {total: 0, subs: {}};
    byParent[p].total += r.amount;
    byParent[p].subs[r.cat] = (byParent[p].subs[r.cat]||0) + r.amount;
  });
  
  const sorted = Object.entries(byParent).sort((a,b) => b[1].total - a[1].total);
  const container = document.getElementById('cat-groups');
  
  if (sorted.length === 0) {
    container.innerHTML = '<div class="no-data-month"><span>📭</span>No hay gastos en este período</div>';
    return;
  }
  
  container.innerHTML = sorted.map(([parent, data]) => {
    const pct = totalExp > 0 ? (data.total/totalExp*100).toFixed(0) : 0;
    const color = CAT_COLORS[parent] || '#6b7280';
    const subs = Object.entries(data.subs).sort((a,b) => b[1]-a[1]);
    
    return `
      <div class="cat-group">
        <div class="cat-group-header">
          <div class="cat-group-left">
            <span class="cat-group-name">${parent}</span>
          </div>
          <div class="cat-group-amount" style="color:${color}">${fmtFull(data.total)}</div>
        </div>
        <div class="cat-group-bar">
          <div class="cat-group-bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
        <div class="cat-group-items">
          ${subs.map(([sub, amt]) => {
            const subPct = data.total > 0 ? (amt/data.total*100).toFixed(0) : 0;
            return `
              <div class="cat-sub-item">
                <span class="cat-sub-name">${sub}</span>
                <span><span class="cat-sub-amount">${fmt(amt)}</span><span class="cat-sub-pct">${subPct}%</span></span>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function renderTransactions() {
  const sorted = [...filteredData].sort((a,b) => (b.parsedDate||0) - (a.parsedDate||0)).slice(0,50);
  const list = document.getElementById('tx-list');
  
  if (sorted.length === 0) {
    list.innerHTML = '<div class="no-data-month"><span>📭</span>No hay movimientos en este período</div>';
    return;
  }
  
  list.innerHTML = sorted.map(r => {
    const isExp = r.type === 'Expense';
    const parent = PARENT_MAP[r.cat] || (isExp ? '📦 Otros' : '💰 Ingresos');
    const emoji = parent.split(' ')[0];
    const dateStr = r.parsedDate ? r.parsedDate.toLocaleDateString('es', {day:'numeric', month:'short'}) : r.date.split(',')[0];
    return `
      <div class="tx-item">
        <div class="tx-icon ${isExp?'expense':'income'}">${emoji}</div>
        <div class="tx-info">
          <div class="tx-cat">${r.cat || (isExp ? 'Gasto' : 'Ingreso')}</div>
          <div class="tx-desc">${r.desc || '—'}</div>
        </div>
        <div class="tx-right">
          <div class="tx-amount ${isExp?'expense':'income'}">${isExp?'-':'+'}${fmt(r.amount)}</div>
          <div class="tx-date">${dateStr}</div>
        </div>
      </div>
    `;
  }).join('');
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  btn.classList.add('active');
}

loadData();
</script>
